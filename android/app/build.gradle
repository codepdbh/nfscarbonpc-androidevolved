plugins { id 'com.android.application' }
android {
    namespace 'com.nfscarbon.androidevolved'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.nfscarbon.androidevolved'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName '0.1.10'
        // -PnfsAbi=armeabi-v7a builds the separate 32-bit APK.
        ndk { abiFilters(project.findProperty('nfsAbi') ?: 'arm64-v8a') }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
    // adrenotools opens its namespace hook libraries by path from nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
}

// ThirteenAG's NFSCarbon.WidescreenFix.asi (MIT), the 2016 build the guest code
// was lifted from (235008 bytes), ships in the APK for game folders holding
// another build. Kept in widescreenfix/ (a copy of the player's file), not in git.
def widescreenFix = file('../../widescreenfix/NFSCarbon.WidescreenFix.asi')
def bundledAssets = layout.buildDirectory.dir('generated/bundledAssets')
tasks.register('bundleWidescreenFix', Copy) {
    doFirst {
        if (!widescreenFix.exists() || widescreenFix.length() != 235008L)
            throw new GradleException("NFSCarbon.WidescreenFix.asi (2016 build, 235008 bytes) not found at ${widescreenFix}")
    }
    from widescreenFix
    into bundledAssets
}
android.sourceSets.main.assets.srcDir bundledAssets
preBuild.dependsOn 'bundleWidescreenFix'
